spring.application.name=produto-service
server.port=8081

# Banco H2 salvo em arquivo (os dados continuam depois de reiniciar)
spring.datasource.url=jdbc:h2:file:./data/produto_db
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza as tabelas a partir das classes Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tela web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console