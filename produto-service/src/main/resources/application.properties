spring.application.name=produto-service
server.port=8081

# Banco H2 salvo em arquivo (os dados continuam depois de reiniciar)
spring.datasource.url=jdbc:h2:file:./data/produto_db
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza as tabelas a partir das classes Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tela web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# RabbitMQ (container do docker-compose.yml na raiz)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin


# Tentativas limitadas: se o listener der erro, tenta de novo 2 vezes (3 no total)
# e depois descarta a mensagem, em vez de repetir para sempre
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s