services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: lojagames-rabbitmq
    ports:
      - "5672:5672"     # porta que as aplicações Java usam
      - "15672:15672"   # painel web de administração
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin