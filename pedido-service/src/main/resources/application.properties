spring.application.name=pedido-service
server.port=8082

spring.datasource.url=jdbc:h2:file:./data/pedido_db
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin


# Tentativas limitadas: se o listener der erro, tenta de novo 2 vezes (3 no total)
# e depois descarta a mensagem, em vez de repetir para sempre
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s